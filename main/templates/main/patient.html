<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .header {
            background: #b30000;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .form-box {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
            border-top: 6px solid #b30000;
        }

        .form-box h2 {
            text-align: center;
            color: #b30000;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            color: #333;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus {
            outline: none;
            border: 2px solid #b30000;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #b30000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #800000;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #b30000;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Blood Bank Management System</h1>
    </div>

    <div class="container">

        <div class="form-box">

            <h2>Patient Registration</h2>

            <form method="POST">
                {% csrf_token %}

                <label>Full Name:</label>
                <input type="text" name="name" required>

                <label>Age:</label>
                <input type="number" name="age" required>

                <label>Blood Group:</label>
                <select name="blood_group" required>
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
                <label>Units Required:</label>
                <input type="number" name="units" min="1" required>

                <label>Phone Number:</label>
                <input type="tel" name="phone" required>

                

                <button type="submit">Register</button>
            </form>

            <a href="/" class="back">← Back to Home</a>

        </div>

    </div>

</body>
</html>
